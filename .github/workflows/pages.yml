# Publish coachloai.com through Actions, so every deploy is a run someone can look at.
name: Deploy coachloai.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the site
        run: |
          mkdir -p ../_site
          rsync -a --exclude '.git' --exclude '.github' ./ ../_site/
          mv ../_site ./_site
          test -f _site/index.html
          test -f _site/coach-loai/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
